[project]
name = "meetingsummarizer"
version = "0.1.0"
description = "An AI-powered Meeting Summarizer tool that also extacts Action Items"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "alembic>=1.18.4",
    "bcrypt==4.0.1",
    "certifi>=2026.4.22",
    "colorama>=0.4.6",
    "fastapi>=0.136.1",
    "faster-whisper>=1.2.1",
    "google-api-python-client>=2.196.0",
    "google-auth>=2.50.0",
    "google-auth-httplib2>=0.3.1",
    "google-auth-oauthlib>=1.3.1",
    "huggingface-hub>=1.14.0",
    "instructor>=1.15.1",
    "openai>=2.35.1",
    "ollama>=0.6.2",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.12",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.28",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.46.0",
    "yt-dlp>=2026.3.17",
    "websockets>=16.0",
]

[tool.ruff]
# Set the target Python version
target-version = "py312"
# Set maximum line length (default is 88, same as Black)
line-length = 100

extend-exclude = [
    "test",
    "alembic"
]

[tool.ruff.lint]
# Select the rules you want to enable
# E: pycodestyle, F: Pyflakes, I: isort, UP: pyupgrade
select = ["E", "F", "I", "UP", "B"]

# Specifically ignore certain rules
ignore = ["E501", "B008", "F401", "UP015"]

[tool.deptry.package_module_name_map]
google-api-python-client = ["googleapiclient"]
google-auth = ["google"]
google-auth-httplib2 = ["google"]

[dependency-groups]
dev = [
    "ruff>=0.15.13",
]
